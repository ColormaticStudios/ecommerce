rule_files:
  - backup-alerts-p3.yaml

evaluation_interval: 1m

tests:
  - interval: 1m
    input_series:
      - series: 'ecommerce_backup_last_run_timestamp_seconds{service="ecommerce-backup",deployment_environment="test",owner="test-on-call",outcome="failed",failure_stage="pg_dump"}'
        values: '1000x5'
    alert_rule_test:
      - eval_time: 2m
        alertname: EcommerceBackupFailed
        exp_alerts:
          - exp_labels:
              service: ecommerce-backup
              deployment_environment: test
              owner: test-on-call
              outcome: failed
              failure_stage: pg_dump
              severity: sev2
            exp_annotations:
              summary: An ecommerce backup failed
              runbook: https://git.colormatic.org/ColormaticStudios/ecommerce/wiki/Backup-and-Restore#ecommercebackupfailed

  - interval: 1m
    input_series:
      - series: 'ecommerce_backup_last_run_timestamp_seconds{service="ecommerce-backup",deployment_environment="test",owner="test-on-call",outcome="succeeded",failure_stage=""}'
        values: '1000x5'
    alert_rule_test:
      - eval_time: 2m
        alertname: EcommerceBackupFailed
        exp_alerts: []

  - interval: 1m
    input_series:
      - series: 'ecommerce_backup_last_success_timestamp_seconds{service="ecommerce-backup",deployment_environment="test",owner="test-on-call"}'
        values: '0x1700'
    alert_rule_test:
      - eval_time: 27h
        alertname: EcommerceBackupMissed
        exp_alerts:
          - exp_labels:
              service: ecommerce-backup
              deployment_environment: test
              owner: test-on-call
              severity: sev2
            exp_annotations:
              summary: No successful ecommerce backup has completed within 26 hours
              runbook: https://git.colormatic.org/ColormaticStudios/ecommerce/wiki/Backup-and-Restore#ecommercebackupmissed
