global:
  scrape_interval: 15s

rule_files:
  - alerts.yaml

scrape_configs:
  - job_name: ecommerce-api
    metrics_path: /metrics
    static_configs:
      - targets:
          - api.internal:9090
        labels:
          service: ecommerce-api
          deployment_environment: production
          owner: commerce-platform

  - job_name: ecommerce-backup
    metrics_path: /metrics
    static_configs:
      - targets:
          - backup-metrics.internal:9091
        labels:
          service: ecommerce-backup
          deployment_environment: production
          owner: commerce-platform
